services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lorebound
      POSTGRES_PASSWORD: lorebound
      POSTGRES_DB: lorebound
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorebound"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lorebound:lorebound@db:5432/lorebound
      REDIS_URL: redis://redis:6379/0
      # Engine pilot (docs/INTEGRATION_PLAN.md §1/§6): off unless ENGINE_MODE=1.
      ENGINE_MODE: ${ENGINE_MODE:-0}
      ENGINE_DATA_DIR: /code/engine_data
    volumes:
      - engine_data:/code/engine_data
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_ENGINE_MODE: ${NEXT_PUBLIC_ENGINE_MODE:-0}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  engine_data:
