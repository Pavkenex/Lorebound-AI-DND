name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e "./backend[dev]" -e ./engine
      - name: Lint
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          cd frontend
          npm ci || npm install
      - name: Typecheck
        run: cd frontend && npm run typecheck --if-present
      - name: Unit tests (3D dice engine — node --test, types stripped natively)
        run: cd frontend && npm test
